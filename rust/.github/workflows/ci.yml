name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_EDIT_VERSION: 0.13.10

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.toolchain.outputs.cachekey }}-cargo-edit-${{ env.CARGO_EDIT_VERSION }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install CLI utilities
        # Do not use tombi-toml/setup-tombi here: it downloads and executes install.sh.
        # Keep using taiki-e/install-action with fallback disabled and pinned hashes.
        uses: taiki-e/install-action@481c34c1cf3a84c68b5e46f4eccfc82af798415a # v2.75.23
        with:
          tool: cargo-audit@0.22.1,tombi@0.9.23
          fallback: none

      - name: Install cargo-edit
        run: cargo install cargo-edit --version "$CARGO_EDIT_VERSION" --locked
        env:
          CARGO_TARGET_DIR: target/cargo-install

      - name: Cargo upgrade check
        run: cargo upgrade --locked

      - name: Cargo update check
        run: cargo update --locked

      - name: Audit for vulnerabilities
        run: cargo audit --deny warnings

      - name: Tombi format check
        run: tombi format --check

      - name: Rustfmt check
        run: cargo fmt --all -- --check

      - name: Tombi lint
        run: tombi lint .

      - name: Clippy lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test suite
        run: cargo test --workspace --all-targets --all-features

      - name: Ensure working tree clean
        run: |
          # 変更があるか確認 (git status --porcelain が空でなければ変更あり)
          if [ -n "$(git status --porcelain)" ]; then
            # ログに何が変わったか出力する
            git status --porcelain
            # CIを失敗させる
            exit 1
          fi

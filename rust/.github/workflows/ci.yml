# このファイルは https://github.com/seiren-games/dev-infra で管理されています。様々なリポジトリで共有することが目的のファイルです。
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('flake.lock') }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Select Nix development environment
        run: |
          RUST_DEV_COMMAND="$RUNNER_TEMP/run-in-rust-dev-shell"
          cat > "$RUST_DEV_COMMAND" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          exec nix develop --no-update-lock-file .#default --command "$@"
          EOF
          chmod 0700 "$RUST_DEV_COMMAND"
          echo "RUST_DEV_COMMAND=$RUST_DEV_COMMAND" >> "$GITHUB_ENV"

      - name: Verify Cargo dependency cooldown
        run: |
          NIGHTLY_CARGO_COMMIT="$(
            "$RUST_DEV_COMMAND" printenv DEV_INFRA_RUST_NIGHTLY_CARGO_COMMIT
          )"
          "$RUST_DEV_COMMAND" cargo --version --verbose \
            | grep -Fx "commit-hash: $NIGHTLY_CARGO_COMMIT"
          "$RUST_DEV_COMMAND" cargo -Z help \
            | grep -F -- "-Z min-publish-age"
          "$RUST_DEV_COMMAND" cargo -Zunstable-options config get unstable.min-publish-age \
            | grep -Fx 'unstable.min-publish-age = true'
          "$RUST_DEV_COMMAND" cargo -Zunstable-options config get resolver.incompatible-publish-age \
            | grep -Fx 'resolver.incompatible-publish-age = "deny"'
          "$RUST_DEV_COMMAND" cargo -Zunstable-options config get registry.global-min-publish-age \
            | grep -Fx 'registry.global-min-publish-age = "7 days"'
          if "$RUST_DEV_COMMAND" cargo -Zunstable-options config get registry.min-publish-age \
            > /dev/null 2>&1; then
            echo "registry.min-publish-age must not override the global policy" >&2
            exit 1
          fi
          if "$RUST_DEV_COMMAND" cargo -Zunstable-options config get registries 2> /dev/null \
            | grep -F ".min-publish-age"; then
            echo "registries.<name>.min-publish-age must not override the global policy" >&2
            exit 1
          fi
          if env | grep -E '^CARGO_REGISTRIES_[[:alnum:]_]+_MIN_PUBLISH_AGE='; then
            echo "CARGO_REGISTRIES_<name>_MIN_PUBLISH_AGE must not override the global policy" >&2
            exit 1
          fi

      - name: Verify stable Rust toolchain freshness
        run: '"$RUST_DEV_COMMAND" check-rust-toolchain-freshness'

      - name: Cargo lockfile check
        run: |
          CARGO_LOCK_CHECK_DIR="$RUNNER_TEMP/cargo-lock-check"
          mkdir -p "$CARGO_LOCK_CHECK_DIR"
          CARGO_RESOLVER_LOCKFILE_PATH="$CARGO_LOCK_CHECK_DIR/Cargo.lock" \
            "$RUST_DEV_COMMAND" cargo generate-lockfile
          diff --unified Cargo.lock "$CARGO_LOCK_CHECK_DIR/Cargo.lock"

      - name: Audit for vulnerabilities
        run: '"$RUST_DEV_COMMAND" cargo audit --deny warnings'

      - name: Tombi format check
        run: '"$RUST_DEV_COMMAND" tombi format --check'

      - name: Rustfmt check
        run: '"$RUST_DEV_COMMAND" cargo fmt --all -- --check'

      - name: Tombi lint
        run: '"$RUST_DEV_COMMAND" tombi lint .'

      - name: Clippy lint
        run: '"$RUST_DEV_COMMAND" cargo clippy --locked --workspace --all-targets --all-features -- -D warnings'

      - name: Test suite
        run: '"$RUST_DEV_COMMAND" cargo test --locked --workspace --all-targets --all-features'

      - name: Ensure working tree clean
        run: |
          # 変更があるか確認 (git status --porcelain が空でなければ変更あり)
          if [ -n "$(git status --porcelain)" ]; then
            # ログに何が変わったか出力する
            git status --porcelain
            # CIを失敗させる
            exit 1
          fi
